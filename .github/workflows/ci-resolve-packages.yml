name: Unity CI - Resolve Packages

on:
  workflow_dispatch:

jobs:
  resolve-packages:
    name: Resolve Unity Packages (pre-build)
    # This job requires a machine or self-hosted runner with Unity installed.
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make resolve script executable
        run: chmod +x .github/scripts/ci/resolve-packages.sh

      - name: Resolve Unity packages
        env:
          UNITY_BIN: ${{ env.UNITY_BIN }}
        run: .github/scripts/ci/resolve-packages.sh

      - name: Upload resolve log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-resolve-log
          path: logs/unity-resolve.log
